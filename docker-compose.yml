version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_PATH=/app/data/plazo_fijo.db
    volumes:
      - plazo_data:/app/data
    restart: always

volumes:
  plazo_data:
